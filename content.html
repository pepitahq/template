<html>
  <head>
    <!-- Deliberately empty, and worth a word because it used to hold this
         collection's styling.

         The markup below describes ONE ITEM and is stamped once per record, so a
         <style> here would repeat its rules for every item on the page — which is
         why pepita drops any it finds, silently. The styling lives in this
         collection's own style.css instead: ONE file, shared by every layout,
         linked once per page.

         Edit it in the editor under Content → this collection → FILES, or with
         write_content_file. The same goes for behaviour: script.js, which runs
         once for the whole page rather than once per item. -->
  </head>
  <body>
    <article class="content-item">
      <p>Edit me.</p>
      <p>Then add your content — in the editor, over MCP, or through our content API.</p>
      <p>Every record takes this shape, with its own values where {{title}} is.</p>
    </article>
  </body>
</html>
